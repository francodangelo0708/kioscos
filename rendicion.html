<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendición de Caja</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #e0e6ed, #f4f6f9); padding: 15px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .box { background: #fff; width: 100%; max-width: 460px; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.06); text-align: center; }
        h2 { color: #1e293b; font-size: 24px; margin-bottom: 20px; font-weight: 700; }
        .sec { font-size: 13px; font-weight: 800; color: #475569; text-transform: uppercase; margin: 25px 0 12px 0; text-align: left; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; }
        .grp { margin-bottom: 14px; text-align: left; }
        label { font-weight: 600; font-size: 13px; color: #64748b; display: block; margin-bottom: 5px; }
        select, input, textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; text-align: center; outline: none; transition: all 0.2s; font-weight: 500; }
        select:focus, input:focus, textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        input:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        .row-p { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; margin-bottom: 8px; }
        .row-b { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); }
        .row-b span { font-weight: 800; font-size: 16px; width: 100px; text-align: left; }
        .row-b input { width: 45%; padding: 8px; font-weight: 700; background: #fff; border: 1px solid #cbd5e1; }
        .b20k { background: #fffde6; color: #856404; border-left: 6px solid #eab308; }
        .b10k { background: #f0f8ff; color: #004085; border-left: 6px solid #38bdf8; }
        .b2k  { background: #fafafa; color: #1e293b; border-left: 6px solid #ef4444; box-shadow: inset 3px 0 0 #000; }
        .b1k  { background: #fff5ec; color: #a04000; border-left: 6px solid #f97316; }
        .b500 { background: #f4f9f4; color: #1e4620; border-left: 6px solid #22c55e; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #3b82f6, #1d4ed8); cursor: pointer; margin-top: 15px; }
        .btn-w { background: linear-gradient(135deg, #2ecc71, #27ae60); margin-top: 10px; }
        .t-box { background: #f8fafc; color: #334155; padding: 12px; border-radius: 10px; text-align: center; font-weight: 700; font-size: 15px; margin-top: 8px; border: 2px dashed #cbd5e1; }
    </style>
</head>
<body>
<div class="box">
    <h2>📋 Rendición de Caja</h2>
    <div class="sec">⏱️ Datos del Turno</div>
    <div class="grp"><label>📅 Fecha:</label><input type="date" id="f" disabled></div>
    <div class="grp"><label>⏰ Hora:</label><input type="time" id="h" disabled></div>
    <div class="grp"><label>👤 Empleado:</label><select id="emp">
        <option value="">-- Elegir --</option><option value="Agostina">Agostina</option><option value="Camila">Camila</option><option value="Evangelina">Evangelina</option><option value="Gemina">Gemina</option><option value="German">German</option><option value="Karen">Karen</option><option value="Martina">Martina</option><option value="Melisa">Melisa</option><option value="Micaela">Micaela</option><option value="Milton">Milton</option><option value="Natalia">Natalia</option><option value="Victoria">Victoria</option><option value="Yamila">Yamila</option><option value="Yesica">Yesica</option>
    </select></div>
    <div class="grp"><label>🌤️ Turno:</label><select id="tur"><option value="">-- Elegir --</option><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option><option value="Noche">Noche</option></select></div>
    <div class="grp"><label>🏪 Kiosco:</label><select id="kio"><option value="">-- Elegir --</option><option value="Amarillo">Amarillo 🟡</option><option value="Rojo">Rojo 🔴</option><option value="Verde">Verde 🟢</option></select></div>
    <div class="sec">🏦 Saldos y Bancos</div>
    <div class="grp"><label>💰 Banco Inicial ($):</label><input type="text" id="bi" inputmode="numeric" placeholder="Monto"></div>
    <div class="grp"><label>💸 Retiro de Banco ($):</label><input type="text" id="rb" inputmode="numeric" placeholder="Monto"></div>
    <div class="grp"><label>📉 Banco Final ($):</label><input type="text" id="bf" inputmode="numeric" placeholder="Monto"></div>
    <div class="grp"><label>💳 Total Tarjetas ($):</label><input type="text" id="tt" inputmode="numeric" placeholder="Monto"></div>
    <div class="sec">📦 Pagos a Proveedores</div>
    <div class="grp">
        <div class="row-p"><input type="text" id="pn1" placeholder="Proveedor 1"><input type="text" id="g1" inputmode="numeric" placeholder="Monto" oninput="smP()"></div>
        <div class="row-p"><input type="text" id="pn2" placeholder="Proveedor 2"><input type="text" id="g2" inputmode="numeric" placeholder="Monto" oninput="smP()"></div>
        <div class="row-p"><input type="text" id="pn3" placeholder="Proveedor 3"><input type="text" id="g3" inputmode="numeric" placeholder="Monto" oninput="smP()"></div>
        <div class="row-p"><input type="text" id="pn4" placeholder="Proveedor 4"><input type="text" id="g4" inputmode="numeric" placeholder="Monto" oninput="smP()"></div>
        <div id="tPr" class="t-box">Total Proveedores: $0</div>
    </div>
    <div class="sec">💵 Conteo de Billetes</div>
    <div class="grp">
        <div class="row-b b20k"><span>$20.000</span><input type="text" id="b20" inputmode="numeric" placeholder="Cantidad" oninput="cc()"></div>
        <div class="row-b b10k"><span>$10.000</span><input type="text" id="b10" inputmode="numeric" placeholder="Cantidad" oninput="cc()"></div>
        <div class="row-b b2k"><span>$2.000</span><input type="text" id="b2" inputmode="numeric" placeholder="Cantidad" oninput="cc()"></div>
        <div class="row-b b1k"><span>$1.000</span><input type="text" id="b1" inputmode="numeric" placeholder="Cantidad" oninput="cc()"></div>
        <div class="row-b b500"><span>$500</span><input type="text" id="b5" inputmode="numeric" placeholder="Cantidad" oninput="cc()"></div>
    </div>
    <div class="sec">✍️ Notas Finales</div>
    <div class="grp"><label>📝 Observaciones:</label><textarea id="obs" rows="2" style="text-align:left;"></textarea></div>
    <button class="btn" id="sub" onclick="enviar()">🚀 Enviar a Google Sheets</button>
    <button class="btn btn-w" onclick="enviarWsp()">🟢 Enviar por WhatsApp</button>
</div>
<script>
    const U = "https://script.google.com/macros/s/AKfycbyOoFfdGQ975WVAMELGvsMc5UQTPapBaXTVDEiTISPJpaPHxG7mOkb91uLZbOtuWJqr6w/exec"; 
    let tEf = 0; let tPr = 0;
    
    window.onload = function() {
        const n = new Date();
        document.getElementById('f').value = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, '0') + "-" + String(n.getDate()).padStart(2, '0');
        document.getElementById('h').value = String(n.getHours()).padStart(2, '0') + ":" + String(n.getMinutes()).padStart(2, '0');
    };
    function smP() {
        const g1 = parseFloat(document.getElementById('g1').value) || 0; const g2 = parseFloat(document.getElementById('g2').value) || 0;
        const g3 = parseFloat(document.getElementById('g3').value) || 0; const g4 = parseFloat(document.getElementById('g4').value) || 0;
        tPr = g1 + g2 + g3 + g4; document.getElementById('tPr').innerText = "Total Proveedores: $" + tPr;
    }
    function cc() {
        const v20 = (parseInt(document.getElementById('b20').value)||0)*20000; const v10 = (parseInt(document.getElementById('b10').value)||0)*10000;
        const v2 = (parseInt(document.getElementById('b2').value)||0)*2000; const v1 = (parseInt(document.getElementById('b1').value)||0)*1000;
        const v5 = (parseInt(document.getElementById('b5').value)||0)*500; tEf = v20 + v10 + v2 + v1 + v5;
    }
    function armarTexto() {
        return `📋 *RENDICIÓN DE CAJA*\n\n📅 *Fecha:* ${document.getElementById('f').value}\n⏰ *Hora:* ${document.getElementById('h').value}\n👤 *Empleado:* ${document.getElementById('emp').value}\n🌤️ *Turno:* ${document.getElementById('tur').value}\n🏪 *Kiosco:* ${document.getElementById('kio').value}\n\n🏦 *SALDOS Y BANCOS:*\n• Inicial: $${document.getElementById('bi').value || 0}\n• Retiro: $${document.getElementById('rb').value || 0}\n• Final: $${document.getElementById('bf').value || 0}\n• Tarjetas: $${document.getElementById('tt').value || 0}\n\n📦 *PROVEEDORES:*\n• ${document.getElementById('pn1').value || 'Prov 1'}: $${document.getElementById('g1').value || 0}\n• ${document.getElementById('pn2').value || 'Prov 2'}: $${document.getElementById('g2').value || 0}\n• ${document.getElementById('pn3').value || 'Prov 3'}: $${document.getElementById('g3').value || 0}\n• ${document.getElementById('pn4').value || 'Prov 4'}: $${document.getElementById('g4').value || 0}\n💰 *Total Prov:* $${tPr}\n\n💵 *BILLETES:*\n• $20.000: ${document.getElementById('b20').value || 0}\n• $10.000: ${document.getElementById('b10').value || 0}\n• $2.000: ${document.getElementById('b2').value || 0}\n• $1.000: ${document.getElementById('b1').value || 0}\n• $500: ${document.getElementById('b5').value || 0}\n💰 *Total Efectivo Contado:* $${tEf}\n\n📝 *Obs:* ${document.getElementById('obs').value || 'Sin notas'}`;
    }
    function enviarWsp() {
        if(!document.getElementById('emp').value || !document.getElementById('tur').value || !document.getElementById('kio').value) return alert("Faltan datos obligatorios del turno.");
        window.open(`https://whatsapp.com{encodeURIComponent(armarTexto())}`, '_blank');
    }
    function enviar() {
        const f = document.getElementById('f').value; const h = document.getElementById('h').value;
        const e = document.getElementById('emp').value; const t = document.getElementById('tur').value; const k = document.getElementById('kio').value;
        if(!e || !t || !k) return alert("Faltan datos obligatorios.");
        if(!confirm("¿Enviar la rendición?")) return;
        const btn = document.getElementById('sub'); btn.disabled = true; btn.innerText = "Enviando...";
        const d = {
            f: f, h: h, e: e, t: t, k: k,
            bi: document.getElementById('bi').value || 0, rb: document.getElementById('rb').value || 0, bf: document.getElementById('bf').value || 0, tt: document.getElementById('tt').value || 0,
            p1: (document.getElementById('pn1').value || 'N/A') + ': ' + (document.getElementById('g1').value || 0),
            p2: (document.getElementById('pn2').value || 'N/A') + ': ' + (document.getElementById('g2').value || 0),
            p3: (document.getElementById('pn3').value || 'N/A') + ': ' + (document.getElementById('g3').value || 0),
            p4: (document.getElementById('pn4').value || 'N/A') + ': ' + (document.getElementById('g4').value || 0),
            b20: document.getElementById('b20').value || 0, b10: document.getElementById('b10').value || 0, b2: document.getElementById('b2').value || 0, b1: document.getElementById('b1').value || 0, b5: document.getElementById('b5').value || 0,
            tot: tEf, o: document.getElementById('obs').value || 'Sin notas'
        };
        fetch(U, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) })
        .then(() => {
            alert("✓ ¡Rendición guardada!"); document.querySelectorAll('input').forEach(i => { if(i.id !== 'f' && i.id !== 'h') i.value = ""; });
            document.getElementById('obs').value = ""; document.getElementById('emp').value = ""; document.getElementById('tur').value = ""; document.getElementById('kio').value = ""; 
            tEf = 0; tPr = 0; document.getElementById('tPr').innerText = "Total Proveedores: $0";
            const x = new Date(); document.getElementById('h').value = String(x.getHours()).padStart(2,'0') + ":" + String(x.getMinutes()).padStart(2,'0');
        }).catch(err => alert("Error: " + err)).finally(() => { btn.disabled = false; btn.innerText = "🚀 Enviar a Google Sheets"; });
    }
</script>
</body>
</html>
