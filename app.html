<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos Internos</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { background: #fff; width: 100%; max-width: 480px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 20px; font-size: 22px; color: #1a1a1a; }
        .step { display: none; }
        .step.active { display: block; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #555; }
        select, input[type="number"] { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 18px; outline: none; transition: border 0.2s; text-align: center; font-weight: 500; }
        select:focus, input:focus { border-color: #4a90e2; }
        
        select#kio option[value="Amarillo"] { background-color: #f1c40f; color: #000; font-weight: bold; }
        select#kio option[value="Rojo"] { background-color: #e74c3c; color: #fff; font-weight: bold; }
        select#kio option[value="Verde"] { background-color: #2ecc71; color: #fff; font-weight: bold; }

        .grid-metodos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px; }
        .btn-pago { width: 100%; padding: 15px 5px; border: none; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; color: #fff; transition: opacity 0.2s, transform 0.1s; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .btn-pago span { font-size: 20px; }
        .btn-pago:active { transform: scale(0.95); }
        .btn-pago:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .efectivo { background-color: #2ecc71; box-shadow: 0 4px 10px rgba(46,204,113,0.2); }
        .transferencia { background-color: #3498db; box-shadow: 0 4px 10px rgba(52,152,219,0.2); }
        .tarjeta { background-color: #9b59b6; box-shadow: 0 4px 10px rgba(155,89,182,0.2); }
        
        .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #4a90e2; color: #fff; }
        .btn-danger { width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background-color: #7f8c8d; color: #fff; margin-top: 25px; padding: 10px; font-size: 13px; opacity: 0.8; }
        .alert-box { background-color: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; display: none; font-size: 16px; }
        
        .info-turno { font-size: 14px; text-align: center; margin-bottom: 20px; padding: 12px; border-radius: 8px; font-weight: bold; line-height: 1.6; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        .bg-amarillo { background-color: #f1c40f !important; color: #000 !important; border: 2px solid #d4ac0d; }
        .bg-rojo { background-color: #e74c3c !important; color: #fff !important; border: 2px solid #c0392b; }
        .bg-verde { background-color: #2ecc71 !important; color: #fff !important; border: 2px solid #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <!-- PASO 1: APERTURA DE TURNO -->
    <div id="p1" class="step active">
        <h2>Apertura de Turno</h2>
        <div class="form-group">
            <label for="emp">Seleccione su Nombre:</label>
            <select id="emp">
                <option value="">-- Elegir --</option>
                <option value="Agostina">Agostina</option>
                <option value="Camila">Camila</option>
                <option value="Eva">Eva</option>
                <option value="Gemina">Gemina</option>
                <option value="German">German</option>
                <option value="Karen">Karen</option>
                <option value="Martina">Martina</option>
                <option value="Melisa">Melisa</option>
                <option value="Micaela">Micaela</option>
                <option value="Milton">Milton</option>
                <option value="Natalia">Natalia</option>
                <option value="Victoria">Victoria</option>
                <option value="Yamila">Yamila</option>
                <option value="Yesica">Yesica</option>
            </select>
        </div>
        <div class="form-group">
            <label for="kio">Seleccione el Kiosco:</label>
            <select id="kio" onchange="cambiarColorSeleccion(this)">
                <option value="">-- Elegir --</option>
                <option value="Amarillo">Amarillo</option>
                <option value="Rojo">Rojo</option>
                <option value="Verde">Verde</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="entrar()">Iniciar Turno</button>
    </div>

    <!-- PASO 2: PANTALLA FIJA DE COBROS -->
    <div id="p2" class="step">
        <h2>Registrar Venta</h2>
        <div id="box" class="info-turno"></div>
        <div id="alerta" class="alert-box">✓ Guardado en Google Sheets</div>
        
        <div class="form-group">
            <label for="mon">Monto Cobrado ($):</label>
            <input type="number" id="mon" placeholder="Ej: 1500" inputmode="numeric">
        </div>
        
        <label>Seleccione el Medio de Pago para Guardar:</label>
        <div class="grid-metodos">
            <button class="btn-pago efectivo" onclick="guardar('Efectivo')"><span>💵</span>EFECTIVO</button>
            <button class="btn-pago transferencia" onclick="guardar('Transferencia')"><span>📲</span>TRANSF.</button>
            <button class="btn-pago tarjeta" onclick="guardar('Tarjeta')"><span>💳</span>TARJETA</button>
        </div>
        
        <button class="btn btn-danger" onclick="cerrar()">Cerrar Turno Actual</button>
    </div>
</div>

<script>
    // URL DE TU COMPLEMENTO GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwankRgWVW7xDAFDmAmq3EEzWWwQlakfX3HpaVKpr4bUXUa6g1uRwjKqNYWxRYmWy651Q/exec"; 

    let t = { e: "", k: "" }; 

    function cambiarColorSeleccion(select) {
        select.style.backgroundColor = ""; select.style.color = "";
        if(select.value === "Amarillo") { select.style.backgroundColor = "#f1c40f"; select.style.color = "#000"; }
        if(select.value === "Rojo") { select.style.backgroundColor = "#e74c3c"; select.style.color = "#fff"; }
        if(select.value === "Verde") { select.style.backgroundColor = "#2ecc71"; select.style.color = "#fff"; }
    }

    function entrar() {
        t.e = document.getElementById('emp').value; 
        t.k = document.getElementById('kio').value;
        if(!t.e || !t.k) return alert("Por favor, seleccione su Nombre y el Kiosco.");
        
        const b = document.getElementById('box'); 
        b.innerHTML = `Empleado: ${t.e}<br>Kiosco: ${t.k}`;
        
        b.className = "info-turno";
        if(t.k === "Amarillo") b.classList.add('bg-amarillo');
        if(t.k === "Rojo") b.classList.add('bg-rojo');
        if(t.k === "Verde") b.classList.add('bg-verde');
        
        document.getElementById('p1').classList.remove('active'); 
        document.getElementById('p2').classList.add('active');
    }

    function guardar(m) {
        const valInput = document.getElementById('mon');
        const val = valInput.value; 
        if(!val || val <= 0) return alert("Por favor, ingrese un monto válido.");
        
        const botones = document.querySelectorAll('.btn-pago');
        botones.forEach(btn => btn.disabled = true); // Bloquea botones un segundo para evitar doble envío

        const nuevoPago = { 
            id: Date.now(),
            fecha: new Date().toLocaleString('es-AR'), 
            emp: t.e, 
            kio: t.k, 
            monto: val, 
            medio: m 
        };
        
        // ENVÍA EL PAGO EN TIEMPO REAL DIRECTO A GOOGLE SHEETS
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(nuevoPago)
        })
        .then(() => {
            valInput.value = ""; 
            const alerta = document.getElementById('alerta');
            alerta.style.display = 'block';
            setTimeout(() => alerta.style.display = 'none', 1200);
        })
        .catch(err => alert("Error de conexión: " + err))
        .finally(() => {
            botones.forEach(btn => btn.disabled = false);
        });
    }

    function cerrar() {
        if(confirm("¿Seguro que querés cerrar el turno actual?")) {
            t = { e: "", k: "" };
            document.getElementById('mon').value = "";
            document.getElementById('emp').value = "";
            document.getElementById('kio').value = "";
            document.getElementById('kio').style.backgroundColor = "";
            document.getElementById('kio').style.color = "";
            document.getElementById('p2').classList.remove('active'); 
            document.getElementById('p1').classList.add('active');
        }
    }
</script>
</body>
</html>
