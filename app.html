<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos Internos</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #e0e6ed, #f4f6f9); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { background: #fff; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); text-align: center; }
        h2 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; font-weight: 700; }
        .step { display: none; } .step.active { display: block; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: #4a5568; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; text-align: center; outline: none; font-weight: 500; color: #2d3748; }
        select:focus, input:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(66,153,225,0.15); }
        .grid-metodos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .btn-pago { width: 100%; padding: 15px 5px; border: none; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-pago:active { transform: scale(0.96); }
        .efectivo { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .transferencia { background: linear-gradient(135deg, #3498db, #2980b9); }
        .tarjeta { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #4a90e2, #357abd); color: #fff; }
        .btn-salir { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; background: #f1f5f9; color: #475569; margin-top: 30px; }
        .alert-box { background-color: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; display: none; border: 1px solid #c8e6c9; }
        .info-turno { font-size: 14px; text-align: center; margin-bottom: 20px; padding: 12px; border-radius: 10px; font-weight: bold; background: #edf2f7; color: #4a5568; line-height: 1.5; }
    </style>
</head>
<body>
<div class="container">
    <div id="p1" class="step active">
        <h2>🔑 Apertura de Turno</h2>
        <div class="form-group"><label>👤 Nombre del Empleado:</label><select id="emp">
            <option value="">-- Elegir --</option>
            <option value="Prueba 1">Prueba 1</option><option value="Prueba 2">Prueba 2</option><option value="Prueba 3">Prueba 3</option>
            <option value="Agostina">Agostina</option><option value="Camila">Camila</option><option value="Eva">Eva</option><option value="Gemina">Gemina</option><option value="German">German</option><option value="Karen">Karen</option><option value="Martina">Martina</option><option value="Melisa">Melisa</option><option value="Micaela">Micaela</option><option value="Milton">Milton</option><option value="Natalia">Natalia</option><option value="Victoria">Victoria</option><option value="Yamila">Yamila</option><option value="Yesica">Yesica</option>
        </select></div>
        <div class="form-group"><label>🏪 Seleccione el Kiosco:</label><select id="kio">
            <option value="">-- Elegir --</option><option value="Amarillo">Amarillo</option><option value="Rojo">Rojo</option><option value="Verde">Verde</option>
        </select></div>
        <div class="form-group"><label>🌤️ Seleccione el Turno:</label><select id="tur">
            <option value="">-- Elegir --</option><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option><option value="Noche">Noche</option>
        </select></div>
        <button class="btn-primary" onclick="entrar()">Iniciar Turno</button>
    </div>
    <div id="p2" class="step">
        <h2>💵 Registrar Venta</h2>
        <div id="box" class="info-turno"></div>
        <div id="alerta" class="alert-box">✓ Venta Guardada con Éxito</div>
        <div class="form-group"><label>Monto Cobrado ($):</label><input type="text" id="mon" placeholder="Escribir monto" inputmode="numeric"></div>
        <label>Medio de Pago:</label>
        <div class="grid-metodos">
            <button class="btn-pago efectivo" onclick="guardar('Efectivo')">💵 EFECTIVO</button>
            <button class="btn-pago transferencia" onclick="guardar('Transferencia')">📲 TRANSF.</button>
            <button class="btn-pago tarjeta" onclick="guardar('Tarjeta')">💳 TARJETA</button>
        </div>
        <button class="btn-salir" id="btnCierre" onclick="salirTurno()">🚪 Cerrar Turno y Salir</button>
    </div>
</div>
<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx17bjCzkzm-GK91CPbtBe-bqAJfmdPmQ4KlOFQPtsqzagpuL1W2o3B0TEYCw1QCYc/exec"; 
    let t = { e: "", k: "", tur: "" }; let acE = 0; let acT = 0; let acC = 0;
    
    function entrar() {
        t.e = document.getElementById('emp').value; t.k = document.getElementById('kio').value; t.tur = document.getElementById('tur').value;
        if(!t.e || !t.k || !t.tur) return alert("Seleccione Nombre, Kiosco y Turno.");
        acE = 0; acT = 0; acC = 0;
        document.getElementById('box').innerHTML = `👤 Empleado: <b>${t.e}</b><br>🏪 Kiosco: <b>${t.k}</b><br>🌤️ Turno: <b>${t.tur}</b>`;
        document.getElementById('p1').classList.remove('active'); document.getElementById('p2').classList.add('active');
    }
    function guardar(m) {
        const valInput = document.getElementById('mon'); const val = parseFloat(valInput.value); 
        if(!val || val <= 0) return alert("Monto inválido.");
        if(m === 'Efectivo') acE += val; if(m === 'Transferencia') acT += val; if(m === 'Tarjeta') acC += val;
        const botones = document.querySelectorAll('.btn-pago'); botones.forEach(btn => btn.disabled = true);
        const datos = { accion: "venta", id: Date.now(), fecha: new Date().toLocaleString('es-AR'), emp: t.e, kio: t.k, tur: t.tur, monto: val, medio: m };
        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) })
        .then(() => {
            valInput.value = ""; const alerta = document.getElementById('alerta'); alerta.style.display = 'block';
            setTimeout(() => alerta.style.display = 'none', 1200);
        }).catch(err => alert("Error: " + err)).finally(() => botones.forEach(btn => btn.disabled = false));
    }
    function salirTurno() {
        if(!confirm("¿Está seguro de cerrar el turno actual?")) return;
        const btnC = document.getElementById('btnCierre'); btnC.disabled = true; btnC.innerText = "Guardando Totales...";
        const datosCierre = { accion: "cierre", fecha: new Date().toLocaleString('es-AR'), emp: t.e, kio: t.k, tur: t.tur, totEfectivo: acE, totTransferencia: acT, totTarjeta: acC };
        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datosCierre) })
        .then(() => {
            alert("✓ ¡Turno cerrado con éxito! Los totales se registraron en la pestaña Resumen.");
            document.getElementById('emp').value = ""; document.getElementById('kio').value = ""; document.getElementById('tur').value = ""; document.getElementById('mon').value = "";
            t = { e: "", k: "", tur: "" }; acE = 0; acT = 0; acC = 0;
            document.getElementById('p2').classList.remove('active'); document.getElementById('p1').classList.add('active');
        }).catch(err => alert("Error: " + err)).finally(() => { btnC.disabled = false; btnC.innerText = "🚪 Cerrar Turno y Salir"; });
    }
</script>
</body>
</html>
